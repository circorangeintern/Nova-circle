# Netlify build + SPA routing config
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Send every route to index.html so client-side routing works on refresh /
# direct links (e.g. /map, /reports/PE-2026-004218).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
